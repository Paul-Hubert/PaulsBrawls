plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"paulsbrawls" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	
	// LangChain4j replaces the OpenAI Java SDK. langchain4j-open-ai keeps the
	// custom-baseUrl path working for LM Studio / Ollama (see LLMConfig.buildModel).
	implementation ("dev.langchain4j:langchain4j:1.0.0")
	implementation ("dev.langchain4j:langchain4j-open-ai:1.0.0")
	// langchain4j-mcp lets godBot consume tools exposed by the local
	// minecraft-mcp-server subprocess (see MCPGateway). The stdio transport
	// is part of this module — no extra dep required.
	implementation ("dev.langchain4j:langchain4j-mcp:1.0.0")

	include ("dev.langchain4j:langchain4j:1.0.0")
	include ("dev.langchain4j:langchain4j-core:1.0.0")
	include ("dev.langchain4j:langchain4j-open-ai:1.0.0")
	include ("dev.langchain4j:langchain4j-http-client:1.0.0")
	include ("dev.langchain4j:langchain4j-http-client-jdk:1.0.0")
	include ("dev.langchain4j:langchain4j-mcp:1.0.0")
	// langchain4j-core pulls jspecify for @NullMarked / @Nullable annotations that
	// are retained at runtime — ship it so reflection / annotation lookups don't NCDFE.
	include ("org.jspecify:jspecify:1.0.0")

	// LangChain4j depends on Jackson; keep these includes so the jar-in-jar runtime
	// closure ships them. ChatBotFunctions' tool POJOs still rely on
	// @JsonClassDescription / @JsonPropertyDescription, and JsonSchemaAdapter walks
	// them reflectively to build LangChain4j ToolSpecifications.
	include ("com.fasterxml.jackson.core:jackson-databind:2.19.1")
	include ("com.fasterxml.jackson.core:jackson-core:2.19.1")
	include ("com.fasterxml.jackson:jackson-bom:2.18.2")
	include ("com.fasterxml.jackson.core:jackson-annotations:2.19.1")
	include 'com.fasterxml.jackson.datatype:jackson-datatype-jdk8:2.19.1'
	include 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.19.1'

	// LangChain4j ships its own HTTP client (java.net.http); the okhttp / okio /
	// kotlin pile fed the old OpenAI SDK's Kotlin core and is no longer needed.
	// victools jsonschema-* fed addTool(Class) in the OpenAI SDK; replaced by
	// JsonSchemaAdapter, which uses plain reflection.
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}


java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

task copyToMods(type: Copy) {
	onlyIf { project.hasProperty('mods_folder') && !project.property('mods_folder').equals('path/to/your/mods') }
	from tasks.named('remapJar')
	into project.property('mods_folder')
	doLast {
		println "Copied mod to ${project.property('mods_folder')}"
	}
}

task copyToClientMods(type: Copy) {
	onlyIf { project.hasProperty('client_mods_folder') && !project.property('client_mods_folder').equals('path/to/your/mods') }
	from tasks.named('remapJar')
	into project.property('client_mods_folder')
	doLast {
		println "Copied mod to ${project.property('client_mods_folder')}"
	}
}

build.finalizedBy(copyToMods)
build.finalizedBy(copyToClientMods)
