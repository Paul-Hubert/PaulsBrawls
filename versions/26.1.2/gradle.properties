# Minecraft 26.1.2: unobfuscated, so the plain Loom with no mappings. The newest version mineflayer 4.39 (the bots)
# can join. Being ported: not in mc_versions yet.
# check these on https://fabricmc.net/develop
minecraft_version=26.1.2
loader_version=0.20.1
fabric_version=0.155.3+26.1.2
java_version=25
# fabric.mod.json's "minecraft" dependency.
minecraft_dependency=~26.1.2

# Where :26.1.2:build copies the jar: the client is the PrismLauncher instance "26.1.2" (its dir is minecraft/, no dot);
# no server folder, because the 26.1.2 dev server (dev-26.1.2/) loads the mod from the source.
client_mods_folder=C:/Users/Paul/AppData/Roaming/PrismLauncher/instances/26.1.2/minecraft/mods
