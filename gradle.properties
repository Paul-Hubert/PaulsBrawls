# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true

# The Minecraft versions this checkout builds, one project each in versions/<version>/ (its gradle.properties holds
# its Minecraft, loader and Fabric API versions). The first is the primary version: runServer, runDevServer, runClient
# and mcpProbe are its tasks; build and test run in every one. 26.1.2 is the default since 2026-11-04 (docs/39);
# "-Pmc_versions=1.21.1" runs the old 1.21.1 servers (quote it in PowerShell, which splits -P…=1.21.1 at the dot).
mc_versions=26.1.2,1.21.1

# Loom, for every version (check on https://fabricmc.net/develop)
loom_version=1.15.5

# Mod Properties
mod_version=1.0.0
maven_group=com.paul.paulsbrawls
archives_base_name=paulsbrawls
