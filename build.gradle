// The root only aggregates. Each Minecraft version is a project, versions/<version>/ (settings.gradle), that builds
// the shared sources in src/ with gradle/mod.gradle, plus its own versions/<version>/src/.
plugins {
	// Both from the same Loom artifact: the remapping plugin for an obfuscated Minecraft (1.21.11 and older), the
	// plain one for an unobfuscated one (26.1 and newer).
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}
